<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="-380 -720 600 1080">
 <title>Graph of aperture diameter vs angular resolution at the diffraction limit</title>
 <desc>Log-log plot of aperture diameter vs angular resolution at the diffraction limit for various light wavelengths compared with various astronomical instruments, by CMG Lee. For example, the blue star shows that the Hubble Space Telescope is almost diffraction-limited in the visible spectrum at 0.1 arcsecs, whereas the red circle shows that the human pupil should have a resolving power of 20 arcsecs in theory, though normally only 60 arcsecs.</desc>
<!--
sin(radians) = 1.22 * lambda / diameter
0.001 / (60 * 60 * 180 / PI) = 1.22 * (nm * 1e9) / diameter
=> diameter = 0.2516430636214575 * nm
y = -100 * lg(diameter) = -100 * lg(0.2516430636214575 * nm)
-->
 <defs>
  <linearGradient id="grad_visible" x1="0" y1="100%" x2="100%" y2="0%">
   <stop offset="47%" stop-color="#ff00ff"/>
   <stop offset="48%" stop-color="#0066cc"/>
   <stop offset="49%" stop-color="#669900"/>
   <stop offset="50%" stop-color="#ff3300"/>
  </linearGradient>
  <linearGradient id="grad_vla" x1="0" y1="0%" x2="100%" y2="0%">
   <stop offset="40%" stop-color="#cccc00" stop-opacity="0"/>
   <stop offset="100%" stop-color="#cccc00" stop-opacity="0.5"/>
  </linearGradient>
  <linearGradient id="grad_vlba" x1="0" y1="0%" x2="100%" y2="0%">
   <stop offset="0%" stop-color="#00ff00" stop-opacity="0.5"/>
   <stop offset="60%" stop-color="#00ff00" stop-opacity="0"/>
  </linearGradient>

  <path id="line" d="M -300 0 l 500 500" stroke-width="2"/>
  <path id="star" d="M 0 -10 L 6 8 L -9 -3 H 9 L -6 8 Z"/>
  <g id="grid">
   <path d="M 0 -30.1030 H 100 M 0 -47.7121 H 100 M 0 -60.2060 H 100 M 0 -69.8970 H 100 M 0 -77.8151 H 100 M 0 -84.5098 H 100 M 0 -90.3090 H 100 M 0 -95.4243 H 100 M 0 -100 H 100" stroke="#cccccc"/>
   <path d="M 0 -100 H 100" stroke="#666666"/>
  </g>
  <rect id="chart" x="-300" y="-700" width="500" height="1000"/>

  <clipPath id="clip">
   <use xlink:href="#chart"/>
  </clipPath>
 </defs>

 <circle cx="0" cy="0" r="9999" fill="#ffffff"/>
 <g font-family="sans-serif" letter-spacing="-1" font-size="20" text-anchor="middle" fill="#000000">
  <g>
   <use xlink:href="#chart" fill="#ffffff"/>
   <g transform="translate(-300,0) scale(5,1)">
    <use xlink:href="#grid" transform="translate(0,-600)"/>
    <use xlink:href="#grid" transform="translate(0,-500)"/>
    <use xlink:href="#grid" transform="translate(0,-400)"/>
    <use xlink:href="#grid" transform="translate(0,-300)"/>
    <use xlink:href="#grid" transform="translate(0,-200)"/>
    <use xlink:href="#grid" transform="translate(0,-100)"/>
    <use xlink:href="#grid" transform="translate(0,0)"/>
    <use xlink:href="#grid" transform="translate(0,100)"/>
    <use xlink:href="#grid" transform="translate(0,200)"/>
    <use xlink:href="#grid" transform="translate(0,300)"/>
   </g>
   <g transform="translate(0,-700) scale(1,10) rotate(90)">
    <use xlink:href="#grid" transform="translate(0,-100)"/>
    <use xlink:href="#grid" transform="translate(0,0)"/>
    <use xlink:href="#grid" transform="translate(0,100)"/>
    <use xlink:href="#grid" transform="translate(0,200)"/>
    <use xlink:href="#grid" transform="translate(0,300)"/>
   </g>
   <path d="M -300 -700 V 300 H 200" stroke="#666666" fill="none"/>
   <g transform="translate(-305,5)" text-anchor="end">
    <text x="0" y="-700"><tspan>10 000</tspan><tspan x="0" dy="15">km</tspan></text>
    <text x="0" y="-600"><tspan>1 000</tspan><tspan x="0" dy="15">km</tspan></text>
    <text x="0" y="-500">100 km</text>
    <text x="0" y="-400">10 km</text>
    <text x="0" y="-300">1 km</text>
    <text x="0" y="-200">100 m</text>
    <text x="0" y="-100">10 m</text>
    <text x="0" y="0">1 m</text>
    <text x="0" y="100">100 mm</text>
    <text x="0" y="200">10 mm</text>
    <text x="0" y="300">1 mm</text>
   </g>
   <g transform="translate(0,330)" fill="#000099">
    <text x="-300" y="0"><tspan>0.001</tspan><tspan x="-300" dy="15">arcsecs</tspan></text>
    <text x="-200" y="0"><tspan>0.01</tspan><tspan x="-200" dy="15">arcsecs</tspan></text>
    <text x="-100" y="0"><tspan>0.1</tspan><tspan x="-100" dy="15">arcsecs</tspan></text>
    <text x="0" y="0"><tspan>1</tspan><tspan x="0" dy="15">arcsec</tspan></text>
    <text x="100" y="0"><tspan>10</tspan><tspan x="90" dy="15">arcsecs</tspan></text>
    <text x="195" y="0"><tspan>100</tspan><tspan x="219" dy="15" text-anchor="end">arcsecs</tspan></text>
   </g>
  </g>
  <g clip-path="url(#clip)">
   <path d="M -300 -785 l 500 500 v 197 l -500 -500" fill="url(#grad_vlba)"/>
   <text transform="translate(-185,-590) rotate(45)" x="0" y="5" fill="#009900"><tspan>VLBA radio bands</tspan><tspan x="0" dy="20">(3-280 mm, or</tspan><tspan x="0" dy="20">96-1.2 GHz)</tspan></text>

   <path d="M -300 -900 l 500 500 v 276 l -500 -500" fill="url(#grad_vla)"/>
   <text transform="translate(130,-300) rotate(45)" x="0" y="5" text-anchor="end" fill="#996600"><tspan>VLA radio bands</tspan><tspan x="0" dy="20">(7-4000 mm, or</tspan><tspan x="0" dy="20">50-0.074 GHz)</tspan></text>

   <path d="M -300 -488 l 500 500 v 260 l -500 -500" fill="#ff0000" fill-opacity="0.25"/>
   <text transform="translate(100,35) rotate(45)" x="0" y="5" fill="#990000"><tspan>infrared</tspan><tspan x="0" dy="20">astronomy</tspan><tspan x="0" dy="20">(0.75-300 &#181;m)</tspan></text>

   <path d="M -300 -191 l 500 500 v 151 l -500 -500" fill="#ff00ff" fill-opacity="0.25"/>
   <text transform="translate(-220,-80) rotate(45)" x="0" y="5" fill="#660066"><tspan>ultraviolet</tspan><tspan x="0" dy="20">astronomy</tspan><tspan x="0" dy="20">(10-320 nm)</tspan></text>

   <path d="M -300 -30 l 500 500 v 300 l -500 -500" fill="#0099ff" fill-opacity="0.25"/>
   <text transform="translate(-165,223) rotate(45)" x="0" y="5" fill="#003399"><tspan>X-ray</tspan><tspan x="0" dy="20">astronomy</tspan><tspan x="0" dy="20">(8-8000 pm)</tspan></text>

   <use xlink:href="#line" transform="translate(0,-543)" stroke="#009966"/>
   <text transform="translate(-15,-330) rotate(45)" x="0" y="5" fill="#009966"><tspan>Cosmic Microwave</tspan><tspan x="0" dy="20">Background</tspan><tspan x="0" dy="20">(1.06 mm)</tspan></text>

   <use xlink:href="#line" transform="translate(0,-772)" stroke="#ff0000"/>
   <text transform="translate(15,-530) rotate(45)" x="0" y="5" fill="#ff0000"><tspan>Hydrogen</tspan><tspan x="0" dy="20">Line</tspan><tspan x="0" dy="20">(21 cm)</tspan></text>

   <path d="M -239 -700 v 1000" stroke="#0000ff"/>
   <text transform="translate(-250,-350) rotate(90)" x="0" y="5" fill="#0000ff"><tspan>Very Large Telescope</tspan><tspan x="0" dy="20">Interferometer</tspan><tspan x="0" dy="20">(4 mas)</tspan></text>

   <path d="M -130 -700 v 1000" stroke="#0000ff"/>
   <text transform="translate(-140,-318) rotate(90)" x="0" y="5" fill="#0000ff"><tspan>adaptive optics</tspan><tspan x="0" dy="20">in 10m telescope</tspan><tspan x="0" dy="20">(50 mas)</tspan></text>

   <path d="M -100 -700 v 1000" stroke="#0000ff"/>
   <text transform="translate(-50,-610) rotate(90)" x="0" y="5" fill="#0000ff"><tspan>Hubble Space</tspan><tspan x="0" dy="20"> Telescope</tspan><tspan x="0" dy="20">(100 mas)</tspan></text>

   <path d="M 178 -700 v 1000" stroke="#0000ff"/>
   <text transform="translate(165,-588) rotate(90)" x="0" y="5" fill="#0000ff"><tspan>20/20 visual acuity</tspan><tspan x="0" dy="20">(1 arcminute)</tspan></text>

   <path d="M -300 -693.5 h 500" stroke="#000000"/>
   <text x="-299" y="-677" text-anchor="start">Very Long Baseline Array max.baseline (8611 km)</text>

   <path d="M -300 -456 h 500" stroke="#000000"/>
   <text x="199" y="-438" text-anchor="end">Very Large Array max.baseline (36 km)</text>

   <path d="M -300 -248 h 500" stroke="#000000"/>
   <text x="199" y="-230" text-anchor="end">Arecibo Observatory (305 m)</text>

   <path d="M -300 -200 h 500" stroke="#000000"/>
   <text x="199" y="-182" text-anchor="end">PIONIER in Very Large Telescope (approx.100 m)</text>

   <path d="M -300 -159 h 500" stroke="#000000"/>
   <text x="199" y="-142" text-anchor="end" letter-spacing="-2">European Extremely Large Telescope (39.3 m)</text>

   <path d="M -300 -136 h 500" stroke="#000000"/>
   <text x="199" y="-118" text-anchor="end">Large Binocular Telescope (22.8 m)</text>

   <path d="M -300 -102 h 500" stroke="#000000"/>
   <text x="199" y="-85" text-anchor="end">Gran Telescopio Canarias (10.4 m)</text>

   <path d="M -300 -81 h 500" stroke="#000000"/>
   <text x="199" y="-63" text-anchor="end" letter-spacing="-2">James Webb Space Telescope (6.5 m)</text>

   <path d="M -300 -38 h 500" stroke="#000000"/>
   <text x="199" y="-20" text-anchor="end" letter-spacing="-2">Hubble Space Telescope (2.4 m)</text>

   <path d="M -300 4 h 500" stroke="#000000"/>
   <text x="-299" y="22" text-anchor="start">36-inch telescope</text>

   <path d="M -300 39 h 500" stroke="#000000"/>
   <text x="-299" y="57" text-anchor="start">16-inch telescope</text>

   <path d="M -300 69 h 500" stroke="#000000"/>
   <text x="-299" y="87" text-anchor="start">8-inch telescope</text>

   <path d="M -300 99 h 500" stroke="#000000"/>
   <text x="-299" y="117" text-anchor="start">4-inch telescope</text>

   <path d="M -300 122 h 500" stroke="#000000"/>
   <text x="-299" y="138" text-anchor="start">60 mm lens</text>

   <path d="M -300 182 h 500" stroke="#000000"/>
   <text x="-299" y="180" text-anchor="start">Galileo's 1620 telescope (15 mm)</text>

   <path d="M -300 204.6 h 500 v 65.4 h -500" fill="#000000" fill-opacity="0.25"/>
   <text x="50" y="240"><tspan>human pupil</tspan><tspan x="50" dy="20">(2-9 mm)</tspan></text>

   <path d="M -300 -227.585 l 500 500 l 28.4 28.4 h -28.4 l -500 -500" fill="url(#grad_visible)" fill-opacity="0.75"/>
   <text transform="translate(-50,37) rotate(45)" x="0" y="5" font-weight="bold">visible light (390-750 nm)</text>

   <use xlink:href="#star" transform="translate(-100,-38)" fill="#0000ff"/>
   <circle cx="130" cy="204" r="7" stroke="#ff0000" fill="#ff0000" fill-opacity="0.75"/>
  </g>
 </g>
</svg>
