title: "Your AstroNotes"
subtitle: "Master's Curriculum in Astrophysics and Cosmology (Semesters 1-3)"
description: "Master's course notes, derivations, and figure references from the University of Padua."
url: "https://yourastronotes.github.io"
baseurl: ""
github_repo: "yourastronotes/yourastronotes.github.io"
publish_tag: "*"
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .github/

relative_links:
  enabled: false
